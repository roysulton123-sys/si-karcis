plugins {
    id 'com.android.application'
}

android {
    namespace 'id.go.malangkab.dispora.sikarcis'
    compileSdk 34

    defaultConfig {
        applicationId "id.go.malangkab.dispora.sikarcis"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.2.2"
    }

    signingConfigs {
        release {
            def ksFile = file("release-key.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "sikarcis2026"
                keyAlias System.getenv("KEY_ALIAS") ?: "sikarcis"
                keyPassword System.getenv("KEY_PASSWORD") ?: "sikarcis2026"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (file("release-key.jks").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.webkit:webkit:1.10.0'
}
