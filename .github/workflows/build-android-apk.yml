name: Build & Publish Android APK (SI-KARCIS Dispora)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Web Assets & Icons to Android Project
        run: node scripts/sync-android-assets.mjs

      - name: Generate Release Keystore
        run: |
          rm -f android/app/release-key.jks
          keytool -genkeypair -v \
            -keystore android/app/release-key.jks \
            -alias sikarcis \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sikarcis2026 \
            -keypass sikarcis2026 \
            -dname "CN=Dispora Kabupaten Malang, OU=SI-KARCIS, O=Pemerintah Kabupaten Malang, L=Malang, ST=Jawa Timur, C=ID"

      - name: Install Gradle 8.6 & Assemble Signed Release APK
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          if [ ! -d "/tmp/gradle-8.6" ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
          fi
          export PATH="/tmp/gradle-8.6/bin:$PATH"
          gradle -v
          mkdir -p apk
          if ! gradle -p android assembleRelease --no-daemon --stacktrace > /tmp/gradle-build.log 2>&1; then
            tail -n 120 /tmp/gradle-build.log
            cp /tmp/gradle-build.log apk/build-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f apk/build-error.log
            git commit -m "chore(android): upload build log [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || true
            exit 1
          fi
          tail -n 30 /tmp/gradle-build.log

      - name: Publish Signed APK to /apk/SI-KARCIS-Dispora.apk
        run: |
          mkdir -p apk
          rm -f apk/build-error.log
          cp android/app/build/outputs/apk/release/app-release.apk apk/SI-KARCIS-Dispora.apk
          ls -lh apk/SI-KARCIS-Dispora.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apk/
          if ! git diff --staged --quiet; then
            git commit -m "chore(android): update signed SI-KARCIS-Dispora.apk [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
